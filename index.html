<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Formação Gestor GAIA — Fale com a gente</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@300;400;500&display=swap');

  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --border: rgba(255,255,255,0.08);
    --accent: #c8f542;
    --accent-dim: rgba(200,245,66,0.12);
    --text: #f0f0ee;
    --muted: rgba(240,240,238,0.45);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(200,245,66,0.07) 0%, transparent 70%);
    pointer-events: none;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3rem 2.5rem;
    max-width: 440px;
    width: 100%;
    text-align: center;
    position: relative;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 60%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 2.5rem;
    opacity: 0.8;
  }

  .spinner-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 2rem;
  }

  .ring {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .ring-inner {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--accent-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: spin 0.9s linear infinite reverse;
  }

  .wa-icon {
    width: 26px;
    height: 26px;
    fill: var(--accent);
    animation: spin 0.9s linear infinite;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 0.75rem;
    line-height: 1.3;
  }

  p.sub {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.7;
    margin-bottom: 2rem;
  }

  .name-badge {
    display: inline-block;
    background: var(--accent-dim);
    border: 1px solid rgba(200,245,66,0.25);
    color: var(--accent);
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 15px;
    padding: 6px 20px;
    border-radius: 100px;
    margin-bottom: 0.5rem;
    letter-spacing: 0.03em;
    min-width: 140px;
  }

  .ticket {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 1.5rem;
    letter-spacing: 0.04em;
  }

  .btn {
    display: block;
    width: 100%;
    padding: 15px 24px;
    background: var(--accent);
    color: #0a0a0a;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.04em;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    text-decoration: none;
    transition: opacity 0.2s, transform 0.15s;
    margin-bottom: 0.75rem;
  }

  .btn:hover { opacity: 0.88; transform: translateY(-1px); }
  .btn:active { transform: scale(0.98); }

  .footer-note {
    font-size: 12px;
    color: var(--muted);
    margin-top: 1.5rem;
    line-height: 1.6;
  }

  .success-icon {
    display: none;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--accent-dim);
    border: 1px solid rgba(200,245,66,0.25);
    align-items: center;
    justify-content: center;
    margin: 0 auto 2rem;
  }

  .success-icon svg {
    width: 32px;
    height: 32px;
    stroke: var(--accent);
    fill: none;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="logo">Formação Gestor GAIA · Wendell & Christian</div>

  <div class="spinner-wrap" id="spinner">
    <div class="ring">
      <div class="ring-inner">
        <svg class="wa-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
          <path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.554 4.11 1.523 5.84L0 24l6.338-1.498A11.952 11.952 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 0 1-5.006-1.374l-.36-.214-3.724.879.934-3.613-.236-.37A9.818 9.818 0 1 1 12 21.818z"/>
        </svg>
      </div>
    </div>
  </div>

  <div id="success-icon" class="success-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
  </div>

  <h1 id="title">Conectando você ao time&hellip;</h1>
  <p class="sub" id="subtitle">Estamos te direcionando para o consultor disponível agora. Aguarde um instante.</p>

  <div class="name-badge" id="name-badge">—</div>
  <div class="ticket" id="ticket"></div>

  <a class="btn" id="wa-btn" href="#" rel="noopener noreferrer">
    Abrir WhatsApp agora
  </a>

  <p class="footer-note">
    Cada novo clique neste link é direcionado<br>para o próximo consultor da fila.
  </p>
</div>

<script>
(function () {
  "use strict";

  // ═══════════════════════════════════════════════════════════════
  // CONFIGURAÇÃO — Fila circular global
  // Ordem: 1 Elidiane → 2 Nicolly → 3 Liz → 4 Derek → 5 Karita → 6 Mateus → (recomeça)
  // Telefones no formato internacional WhatsApp: 55 + DDD + número (só dígitos)
  // ═══════════════════════════════════════════════════════════════
  var CONTACTS = [
    { name: "Elidiane", phone: "5511992786359" },
    { name: "Nicolly",  phone: "5511978754080" },
    { name: "Liz",      phone: "5511941424638" }, // 11 94142-4638 (atualizado)
    { name: "Derek",    phone: "5511921046733" },
    { name: "Karita",   phone: "5562995263819" },
    { name: "Mateus",   phone: "5511968826237" }
  ];

  var MSG =
    "Olá, tudo bem? Preciso de ajuda para fazer a minha Inscrição da Formação Gestor GAIA com o Wendell Carvalho & Christian Barbosa";

  // Contador GLOBAL atômico (Abacus). Namespace v4 = fila limpa.
  // Fila compartilhada na nuvem (não depende do aparelho do visitante).
  // CounterAPI só como reserva (em paralelo pode repetir ticket).
  var COUNTER_NS  = "gestor-gaia-fila-v4";
  var COUNTER_KEY = "consultores";
  var ANIM_MS     = 1600;
  var FETCH_MS    = 4500;

  var assigned = false;

  function $(id) {
    return document.getElementById(id);
  }

  function buildWAUrl(phone, msg) {
    return "https://wa.me/" + phone + "?text=" + encodeURIComponent(msg);
  }

  function ticketToIndex(ticket) {
    var n = CONTACTS.length;
    var t = Number(ticket);
    if (!Number.isFinite(t) || t < 1) return 0;
    return (Math.floor(t) - 1) % n;
  }

  function fetchWithTimeout(url, ms) {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, ms);
    return fetch(url, {
      method: "GET",
      cache: "no-store",
      mode: "cors",
      credentials: "omit",
      signal: ctrl.signal,
      headers: {
        "Cache-Control": "no-cache, no-store",
        "Pragma": "no-cache"
      }
    }).finally(function () {
      clearTimeout(timer);
    });
  }

  /**
   * Próximo ticket GLOBAL da fila (1, 2, 3, …).
   * Abacus incrementa de forma atômica — cliques simultâneos recebem tickets diferentes.
   */
  async function nextTicket() {
    var bust = Date.now() + "-" + Math.random().toString(36).slice(2, 10);

    // 1) Principal: Abacus (atômico)
    try {
      var res = await fetchWithTimeout(
        "https://abacus.jasoncameron.dev/hit/" +
          encodeURIComponent(COUNTER_NS) + "/" +
          encodeURIComponent(COUNTER_KEY) +
          "?t=" + encodeURIComponent(bust),
        FETCH_MS
      );
      if (res.ok) {
        var data = await res.json();
        var value = Number(data && data.value);
        if (Number.isFinite(value) && value >= 1) {
          return { ticket: Math.floor(value), source: "abacus" };
        }
      }
    } catch (err) {
      // tenta fallback
    }

    // 2) Reserva: CounterAPI (só se Abacus falhar), com cache-bust
    try {
      var res2 = await fetchWithTimeout(
        "https://api.counterapi.dev/v1/" +
          encodeURIComponent(COUNTER_NS) + "/" +
          encodeURIComponent(COUNTER_KEY) +
          "/up?t=" + encodeURIComponent(bust),
        FETCH_MS
      );
      if (res2.ok) {
        var data2 = await res2.json();
        var count = Number(data2 && data2.count);
        if (Number.isFinite(count) && count >= 1) {
          return { ticket: Math.floor(count), source: "counterapi" };
        }
      }
    } catch (err2) {
      // tenta fallback final
    }

    // 3) Último recurso: distribui por tempo (não é fila perfeita, mas não trava no redirect)
    var idx = Math.abs(Date.now()) % CONTACTS.length;
    return { ticket: idx + 1, source: "fallback", idxOverride: idx };
  }

  function applyUI(contact, ticket, url) {
    $("name-badge").textContent = contact.name;
    $("wa-btn").href = url;
    $("ticket").textContent =
      "Fila #" + ticket + " · " + (ticketToIndex(ticket) + 1) + "/" + CONTACTS.length;
  }

  function showSuccess(contact) {
    $("spinner").style.display = "none";
    $("success-icon").style.display = "flex";
    $("title").textContent = "Tudo certo!";
    $("subtitle").textContent =
      "Você está sendo conectado com " + contact.name +
      ". Se não abrir automaticamente, clique no botão abaixo.";
  }

  function resetLoadingUI() {
    $("spinner").style.display = "flex";
    $("success-icon").style.display = "none";
    $("title").textContent = "Conectando você ao time…";
    $("subtitle").textContent =
      "Estamos te direcionando para o consultor disponível agora. Aguarde um instante.";
    $("name-badge").textContent = "—";
    $("ticket").textContent = "";
    $("wa-btn").href = "#";
  }

  async function runAssignment() {
    if (assigned) return;
    assigned = true;

    var startedAt = Date.now();
    var result = await nextTicket();

    var idx =
      typeof result.idxOverride === "number"
        ? result.idxOverride
        : ticketToIndex(result.ticket);

    // Proteção: índice sempre válido
    if (idx < 0 || idx >= CONTACTS.length || !CONTACTS[idx]) {
      idx = 0;
    }

    var contact = CONTACTS[idx];
    var ticket = result.ticket;
    var url = buildWAUrl(contact.phone, MSG);

    applyUI(contact, ticket, url);

    var wait = Math.max(0, ANIM_MS - (Date.now() - startedAt));
    setTimeout(function () {
      showSuccess(contact);
      // replace evita voltar para a página de loading no histórico
      window.location.replace(url);
    }, wait);
  }

  function boot() {
    runAssignment();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }

  // WhatsApp / Safari às vezes restauram a página do cache ao voltar
  window.addEventListener("pageshow", function (ev) {
    if (ev.persisted) {
      assigned = false;
      resetLoadingUI();
      runAssignment();
    }
  });
})();
</script>
</body>
</html>
